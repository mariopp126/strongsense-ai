name: strongsense
description: "StrongSense AI - powerlifting training with readiness-based auto-regulation and optional AI coaching."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: 0.20.2
  fl_chart: ^1.3.1
  http: ^1.6.0
  strongsense_core:
    path: ../../packages/strongsense_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"
