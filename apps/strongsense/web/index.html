<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="StrongSense AI — powerlifting training with readiness-based auto-regulation and optional AI coaching.">
  <meta name="theme-color" content="#0F172A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StrongSense AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StrongSense AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0F172A;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      transition: opacity 300ms ease-out;
    }
    #splash img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="StrongSense AI" /></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 320);
    }
    window.addEventListener('flutter-first-frame', hideSplash);
    // Safety net: never leave the splash covering the app.
    setTimeout(hideSplash, 8000);
  </script>
</body>
</html>
