include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Flutter 3.50 moved Material/Cupertino into the material_ui/cupertino_ui
    # packages and deprecated `package:flutter/material.dart`. The import is
    # still functional and is used throughout the app; migrating every widget
    # to the new packages is tracked as a separate follow-up. Keep
    # `--fatal-infos` meaningful for every other diagnostic.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
