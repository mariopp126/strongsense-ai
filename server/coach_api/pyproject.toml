[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strongsense-coach-api"
version = "0.1.0"
description = "Stateless FastAPI service that enriches StrongSense AI training plans with validated, clamped LLM coaching."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "StrongSense AI" }]
keywords = ["fastapi", "strength-training", "llm", "coach"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.162,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "httpx>=0.28,<0.29",
  "pydantic>=2.14,<3.0",
  "pydantic-settings>=2.16,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-asyncio>=1.5,<2.0",
  "respx>=0.23,<0.24",
  "ruff>=0.17,<1.0",
  "mypy>=2.4,<3.0",
]

[tool.setuptools]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff: line length 100, Python 3.12
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
  # FastAPI uses function calls (Depends/Query/...) in argument defaults.
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

# ---------------------------------------------------------------------------
# mypy: pragmatic (non-strict), app package only
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest: tests/ only, coverage enforced in CI via the command line
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
